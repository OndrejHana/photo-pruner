name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/download-orf-fixtures.py
      - run: swift test
        env:
          ORF_FIXTURES: ${{ github.workspace }}/artifacts/fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orf-preview-evidence
          path: artifacts/native-evidence/
